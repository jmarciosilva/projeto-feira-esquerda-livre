; Ajustes de desenvolvimento local (Docker).
; Carregado como conf.d/zz-app.ini, sobrescrevendo os defaults da imagem.

memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

upload_max_filesize = 64M
post_max_size = 64M

date.timezone = America/Sao_Paulo
expose_php = Off

; Erros visiveis no log do container (docker compose logs app)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; OPcache em modo desenvolvimento: acelera, mas revalida o arquivo a cada
; requisicao para que a edicao no Windows apareca imediatamente.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
