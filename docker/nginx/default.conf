server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # Bind mounts do Docker Desktop (virtiofs) podem servir arquivos truncados
    # ou desatualizados com sendfile ligado. Desligado para desenvolvimento.
    sendfile off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Rotas do Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets estaticos, incluindo o symlink public/storage
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|pdf|mp4|webm)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Bloqueia arquivos ocultos (.env, .git), preservando /.well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
